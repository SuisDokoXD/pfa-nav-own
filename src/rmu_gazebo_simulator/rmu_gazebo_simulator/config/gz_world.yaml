  rmuc_2027:
    # 场地以中心为原点: 28m x 16m, x∈[-14,14], y∈[-8,8]
    # 高度约定沿用往年(rmuc_2026): 2026 站立面在 z=0.20、出生 z=0.28，
    #   即出生高度 = 站立面 + 0.08 m。2027 该处站立面实测 0.30 -> z=0.38。
    # 出生位置也沿用往年: 2026 出生点在场地下缘归一化 u=0.154 / v=0.501，
    #   换算到 2027 中心坐标系 = (-9.69, 0.00)；镜像蓝方 (9.69, 0.00)。
    # 该点最近竖立面 1.06 m（旧占位 (0,-6.5) 只有 0.15 m，已弃用）。
    - name: "red_standard_robot1"
      color: "red"
      x_pose: "-9.69"
      y_pose: "0.0"
      z_pose: "0.38"
      yaw: "0.0"

